<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Acceso</title>
<link rel="icon" href="m/7d3a93582f6e.svg">
<link rel="stylesheet" href="a.css?v=20261121195348-7ab1f4">
<script src="a.js?v=20261121195348-7ab1f4" defer></script>
</head>
<body class="cargando">
<div id="fondo" aria-hidden="true">
<div id="trama"><i class="h"></i><i class="v"></i><b class="hilo"></b></div>
<img id="poster" alt="" hidden>
<video id="vid" muted playsinline preload="auto" hidden></video>
<video id="vsi" class="reac" muted playsinline preload="none"></video>
<video id="vno" class="reac" muted playsinline preload="none"></video>
</div>
<div class="vineta" aria-hidden="true"></div>
<div class="grano" aria-hidden="true"></div>
<div class="degradado" aria-hidden="true"></div>
<div class="cine arriba" aria-hidden="true"></div>
<div class="cine abajo" aria-hidden="true"></div>
<div id="velo" aria-hidden="true"></div>
<div id="carga" role="status"><span class="latido"></span><span id="carga-txt">Cargando…</span></div>
<div id="mandos">
<button type="button" id="b-sonido" class="mando" aria-pressed="false" title="Sonido (sintetizado en el navegador)"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path class="ondas" d="M13 7.2a4 4 0 0 1 0 5.6M15.3 5a7.2 7.2 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path class="mudo" d="M13 7.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Sonido</span></button>
<button type="button" id="b-saltar" class="mando" title="Saltar (Esc o Espacio)"><span>Saltar</span><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 4l7 6-7 6zM13 4h2v12h-2z" fill="currentColor"/></svg><i class="progreso"><b></b></i></button>
</div>
<main id="acceso" hidden>
<section class="tarjeta" aria-labelledby="t-acceso">
<img id="marcas" class="marcas" alt="" hidden>
<h1 id="t-acceso">Acceso privado</h1>
<p class="intro">Escribe la clave que te han pasado.</p>
<p id="aviso" class="aviso" hidden></p>
<form id="f-acceso" autocomplete="on" novalidate>
<input type="text" name="usuario" autocomplete="username" value="equipo" class="oculto" tabindex="-1" aria-hidden="true" readonly>
<label for="clave">Clave</label>
<div class="campo">
<input id="clave" name="clave" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" autocorrect="off" maxlength="256" required aria-describedby="error">
<button type="button" id="b-ver" class="ver" aria-pressed="false" aria-label="Mostrar la clave" title="Mostrar la clave"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="tachar" d="M4 20L20 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</div>
<div class="barra" id="barra" aria-hidden="true"><b></b></div>
<p id="error" class="error" role="alert"></p>
<button type="submit" id="b-entrar" class="entrar"><span>Entrar</span><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 10h11m-4-4.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</form>
<div class="pie"><button type="button" id="b-trailer" class="enlace">Ver el tráiler</button><span>La clave te la dan por otro canal.</span></div>
</section>
</main>
<noscript><div class="sin-js">Esta página necesita JavaScript.</div></noscript>
</body>
</html>
